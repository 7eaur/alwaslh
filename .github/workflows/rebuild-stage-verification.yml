name: Rebuild Stage Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-stage-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-1-product-contract:
    name: Stage 1 · Product contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify product feature contract
        run: python3 scripts/verify-product-contract.py

  stage-2-brand:
    name: Stage 2 · Brand identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical brand assets
        run: python3 scripts/verify-brand.py

  stage-3-ux:
    name: Stage 3 · UX architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify UX contracts and parity coverage
        run: python3 scripts/verify-ux.py

  stage-4-postgresql:
    name: Stage 4 · PostgreSQL clean build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations and run database contract tests
        run: bash database/tests/run.sh

  stage-5-engineering-foundation:
    name: Stage 5 · Engineering foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage5
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint API
        run: npm run lint --prefix apps/api
      - name: Typecheck API
        run: npm run typecheck --prefix apps/api
      - name: Test API
        run: npm test --prefix apps/api
      - name: Build API
        run: npm run build --prefix apps/api
      - name: Run migration runner on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Re-run migrations to prove idempotent skip behavior
        run: npm run db:migrate --prefix apps/api
      - name: Verify applied migration count
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          expected="$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(psql "$DATABASE_URL" -Atqc 'select count(*) from schema_migrations')"
          test "$actual" = "$expected"
      - name: Install and build Admin
        run: |
          npm install --prefix apps/admin-web --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix apps/admin-web
          npm run build --prefix apps/admin-web
      - name: Install and build Student
        run: |
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix apps/student-web
          npm run build --prefix apps/student-web

  stage-6-auth-authorization:
    name: Stage 6 · Auth & authorization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_auth
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://localhost:5173
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint and typecheck auth source
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
      - name: Run unit tests including auth cryptography
        run: npm test --prefix apps/api
      - name: Apply all migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify explicit first-admin bootstrap and refusal on repeat
        env:
          ADMIN_BOOTSTRAP_IDENTIFIER: admin-bootstrap
          ADMIN_BOOTSTRAP_PASSWORD: BootstrapPass123!
          ADMIN_BOOTSTRAP_DISPLAY_NAME: مدير التهيئة
        run: |
          npm run auth:create-admin --prefix apps/api
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from profiles where role = 'admin'")" = "1"
          psql "$DATABASE_URL" -Atqc "select password_hash from auth_credentials" | grep -q '^scrypt\$'
          if npm run auth:create-admin --prefix apps/api; then
            echo 'FAIL: second bootstrap admin creation unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Run PostgreSQL auth lifecycle and role-isolation integration tests
        run: npm run test:integration --prefix apps/api

  stage-7-access-entitlements:
    name: Stage 7 · Access codes & entitlements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_access
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_access"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_access
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck and unit test access source
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
      - name: Apply migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify PostgreSQL access constraints
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_constraint where conname in ('full_access_codes_duration_valid','class_access_codes_duration_valid')")" = "2"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_indexes where indexname in ('ux_active_all_content_entitlement','ux_active_class_entitlement')")" = "2"
      - name: Run access lifecycle, renewal and race integration tests
        run: node --test --import tsx tests/integration/access.integration.test.ts
        working-directory: apps/api
