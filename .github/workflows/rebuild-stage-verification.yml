name: Rebuild Stage Verification

on:
  pull_request:
  push:
    branches:
      - rebuild/foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-stage-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-1-product-contract:
    name: Stage 1 · Product contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify product feature contract
        run: python3 scripts/verify-product-contract.py

  stage-2-brand:
    name: Stage 2 · Brand identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical brand assets
        run: python3 scripts/verify-brand.py

  stage-3-ux:
    name: Stage 3 · UX architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify UX contracts and parity coverage
        run: python3 scripts/verify-ux.py

  stage-4-postgresql:
    name: Stage 4 · PostgreSQL clean build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations and run database contract tests
        run: bash database/tests/run.sh
