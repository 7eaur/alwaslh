name: Stage 13F Question Bank Verification

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - integration/stage13f-question-bank

permissions:
  contents: read

concurrency:
  group: stage13f-question-bank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage13f-question-bank:
    name: Stage 13F · Question Bank + Quiz Builder authority
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13f
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13f"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13f
      LOG_LEVEL: silent
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck, unit test and build
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify Stage13F PostgreSQL contracts
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname in ('question_bank_items','question_bank_revisions','question_bank_revision_lessons','question_bank_revision_sources','question_bank_ai_imports','question_bank_events') and relkind='r'")" = "6"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_type where typname in ('question_bank_origin','question_bank_revision_status','question_bank_question_type','question_bank_answer_status','question_bank_difficulty','question_bank_event_action')")" = "6"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_enum e join pg_type t on t.oid=e.enumtypid where t.typname='question_bank_question_type' and e.enumlabel='direct'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_enum e join pg_type t on t.oid=e.enumtypid where (t.typname='question_type' and e.enumlabel='direct') or (t.typname='quiz_status' and e.enumlabel='review')")" = "2"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname='quiz_builder_events' and relkind='r'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_constraint where conname in ('question_bank_revisions_type_shape','question_bank_revisions_answer_shape','question_bank_revisions_published_state','question_bank_ai_import_review_fk','question_bank_events_reject_note_required','questions_question_bank_revision_fk','questions_direct_answer_shape','quizzes_offering_fk')")" = "8"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_indexes where indexname in ('ux_question_bank_open_revision','ux_question_bank_published_revision','idx_questions_question_bank_revision')")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_trigger where tgname='question_bank_regeneration_identity_guard' and not tgisinternal")" = "1"
      - name: Run Stage13F Question Bank integration
        run: node --test --import tsx tests/integration/question-bank.integration.test.ts
        working-directory: apps/api
      - name: Run Stage13F stable regeneration integration
        run: node --test --import tsx tests/integration/question-bank-regeneration.integration.test.ts
        working-directory: apps/api
      - name: Run Stage13F Quiz Builder integration
        run: node --test --import tsx tests/integration/quiz-builder.integration.test.ts
        working-directory: apps/api
