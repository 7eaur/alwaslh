name: Stage15 One-shot E2E Stability Fix

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - ".github/workflows/stage15-e2e-stability-fix.yml"

permissions:
  contents: write

jobs:
  fix-e2e-selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped and stable Playwright selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          activation = Path("apps/student-web/e2e/activation.e2e.spec.mjs")
          text = activation.read_text()
          old = '  await page.getByRole("button", { name: "تحديث", exact: true }).click();'
          new = '''  await page
            .getByLabel("صلاحياتك ورموز الصفوف")
            .getByRole("button", { name: "تحديث", exact: true })
            .click();'''
          if text.count(old) != 1:
              raise SystemExit(f"activation refresh target mismatch: {text.count(old)}")
          activation.write_text(text.replace(old, new))

          assessment = Path("apps/student-web/e2e/assessment.e2e.spec.mjs")
          text = assessment.read_text()
          old = '''async function openVersionA(page, card, fixture, mode) {
  await card.getByLabel("النموذج").selectOption({ label: fixture.versionALabel });
  const responsePromise = page.waitForResponse(
    (response) =>
      response.url().includes(`/v1/student/quizzes/${fixture.quizId}/sessions`) &&
      response.request().method() === "POST" &&
      response.status() === 200,
  );
  await card.getByRole("button", { name: mode === "practice" ? "بدء تدريب" : "بدء اختبار" }).click();
  const response = await responsePromise;
  return response.json();
}'''
          new = '''async function openVersionA(page, card, fixture, mode) {
  const selector = `[data-quiz-id="${fixture.quizId}"]`;
  await card.getByLabel("النموذج").selectOption({ label: fixture.versionALabel });
  await expect(page.locator(selector).getByText(`سيُستخدم ${fixture.versionALabel}.`, { exact: true })).toBeVisible();
  const responsePromise = page.waitForResponse(
    (response) =>
      response.url().includes(`/v1/student/quizzes/${fixture.quizId}/sessions`) &&
      response.request().method() === "POST" &&
      response.status() === 200,
  );
  await page
    .locator(selector)
    .getByRole("button", { name: mode === "practice" ? "بدء تدريب" : "بدء اختبار" })
    .click();
  const response = await responsePromise;
  return response.json();
}'''
          if text.count(old) != 1:
              raise SystemExit("assessment helper target mismatch")
          assessment.write_text(text.replace(old, new))
          PY
      - name: Install Student dependencies
        run: npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Verify Student static quality
        run: |
          npm run lint --prefix apps/student-web
          npm run typecheck --prefix apps/student-web
          npm test --prefix apps/student-web
      - name: Commit E2E stability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/student-web/e2e/activation.e2e.spec.mjs apps/student-web/e2e/assessment.e2e.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(student): scope and stabilize Stage15 browser selectors"
          git push origin HEAD:parallel/stage14-student-product
