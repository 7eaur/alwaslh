name: Stage 12 AI Execution Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage12-ai-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage12-ai-execution:
    name: Stage 12 · Durable provider-neutral AI execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage12
      LOG_LEVEL: silent
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck, unit test and build AI execution source
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify Stage12 PostgreSQL execution contracts
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname='ai_execution_attempts' and relkind='r'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from information_schema.columns where table_name='ai_job_units' and column_name in ('max_attempts','lease_token','lease_expires_at')")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_constraint where conname in ('ai_job_units_max_attempts_valid','ai_job_units_running_lease_shape','ai_execution_attempts_unit_number_unique')")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_indexes where indexname in ('idx_ai_job_units_stage12_claim','idx_ai_execution_attempts_unit_started','idx_ai_execution_attempts_route_started')")" = "3"
      - name: Run PostgreSQL idempotency, lease, cascade, retry, cancellation and partial-success tests
        run: node --test --import tsx tests/integration/ai-execution.integration.test.ts
        working-directory: apps/api
