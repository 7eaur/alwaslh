name: UX B01 Shared Frontend Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/student-web/**"
      - "apps/admin-web/**"
      - "packages/brand/**"
      - "packages/ui/**"
      - ".github/workflows/ux-b01-shared-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-b01-shared-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routing-foundation:
    name: Student 390px + Admin desktop routing foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_ux_b01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_ux_b01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_ux_b01
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5174,http://127.0.0.1:5175
      VITE_API_BASE_URL: http://127.0.0.1:3000
      VITE_OFFLINE_AUTH_PUBLIC_KEY_SPKI: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2FrUJV0pXSOuz0j98o48vPAnWIa9IBNVzBbWB5VxFWsunmwrSIc0D9clavqX4QFg1dPRq3vEkD21VNdpwpFflA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API, Student and Admin dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/admin-web --ignore-scripts --no-audit --no-fund

      - name: Build runtime applications
        run: |
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run typecheck --prefix apps/student-web
          npm run build --prefix apps/student-web
          npm run typecheck --prefix apps/admin-web
          npm run build --prefix apps/admin-web

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api

      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium

      - name: Verify Student routing at 390px
        working-directory: apps/student-web
        run: npx playwright test e2e/routing-foundation.e2e.spec.mjs

      - name: Verify Admin routing at desktop width
        working-directory: apps/admin-web
        run: npx playwright test e2e/routing-foundation.e2e.spec.mjs
