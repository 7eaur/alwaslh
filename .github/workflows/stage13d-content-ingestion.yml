name: Stage 13D Content Ingestion Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage13d-content-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage13d-backend:
    name: Stage 13D · Ingestion + publication backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13d
      LOG_LEVEL: silent
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media runtime and PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils postgresql-client >/dev/null
          pdfinfo -v
          pdftoppm -v
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck, unit test and build API
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify ingestion and publication schema
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_type where typname in ('content_ingestion_task_status','content_ingestion_item_status','lesson_asset_publication_status')")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('content_ingestion_tasks','content_ingestion_items','content_ingestion_media')")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from information_schema.columns where table_name='lesson_assets' and column_name in ('media_asset_id','ingestion_task_id','ingestion_item_id','publication_status','submitted_for_review_at','asset_published_at')")" = "6"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_constraint where conname in ('content_ingestion_tasks_request_unique','content_ingestion_media_item_fk','lesson_assets_ingestion_item_fk','lesson_assets_published_state')")" = "4"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_indexes where indexname in ('idx_content_ingestion_tasks_status_created','idx_content_ingestion_items_task_status_position','idx_content_ingestion_media_task_position','ux_lesson_assets_lesson_media')")" = "4"
      - name: Run durable mixed ingestion and publication integration test
        run: node --test --import tsx tests/integration/content-ingestion.integration.test.ts
        working-directory: apps/api
