name: Stage 11 AI Contract Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage11-ai-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage11-ai-contracts:
    name: Stage 11 · Provider-neutral AI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint AI contracts and tests
        run: npm run lint --prefix apps/api
      - name: Typecheck API
        run: npm run typecheck --prefix apps/api
      - name: Run unit tests including Stage11 golden contracts
        run: npm test --prefix apps/api
      - name: Build API
        run: npm run build --prefix apps/api
