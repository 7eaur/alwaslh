name: UX B05 Student Downloads and Account

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/student-web/**"
      - "packages/brand/**"
      - "packages/ui/**"
      - ".github/workflows/ux-b05-student-downloads-account.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-b05-student-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  student-b05:
    name: Downloads + Account + copy closure · real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_ux_b05
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_ux_b05"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_ux_b05
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5174
      VITE_OFFLINE_AUTH_PUBLIC_KEY_SPKI: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2FrUJV0pXSOuz0j98o48vPAnWIa9IBNVzBbWB5VxFWsunmwrSIc0D9clavqX4QFg1dPRq3vEkD21VNdpwpFflA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API and Student dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund

      - name: Verify API and Student quality
        run: |
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run lint --prefix apps/student-web
          npm run typecheck --prefix apps/student-web
          npm test --prefix apps/student-web
          npm run build --prefix apps/student-web

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api

      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium

      - name: Verify B05 behavior and visual acceptance
        working-directory: apps/student-web
        run: >-
          npx playwright test
          e2e/offline-download.e2e.spec.mjs
          e2e/student-b05.e2e.spec.mjs

      - name: Upload B05 visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-b05-visual-qa
          path: apps/student-web/test-results/ux-b05-*.png
          if-no-files-found: warn
          retention-days: 7
