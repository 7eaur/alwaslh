name: Temporary Bootstrap Formatter

on:
  push:
    branches:
      - ops/legacy-content-first-batch-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/legacy-content-first-batch-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Remove stale constant and apply repository formatter
        run: |
          sed -i '/^const SOURCE_BUCKET = "lesson_content";$/d' apps/api/src/content/legacy-supabase-importer.ts
          npx --prefix apps/api biome check --write apps/api/src/content/legacy-supabase-startup.ts apps/api/tests/legacy-supabase-startup.test.ts apps/api/src/content/legacy-supabase-importer.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/content/legacy-supabase-startup.ts apps/api/tests/legacy-supabase-startup.test.ts apps/api/src/content/legacy-supabase-importer.ts
          git diff --cached --quiet || git commit -m "style: format guarded production bootstrap"
          git push origin HEAD:ops/legacy-content-first-batch-bootstrap
