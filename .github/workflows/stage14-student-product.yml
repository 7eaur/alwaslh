# Student Track exact-head verification trigger 2
name: Stage14 Student Product

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - "apps/student-web/**"
      - "apps/api/**"
      - "database/migrations/**"
      - "packages/**"
      - ".github/workflows/stage14-student-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage14-student-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-quality:
    name: Student lint · typecheck · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Student dependencies
        run: npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Run Student quality gates
        run: |
          npm run lint --prefix apps/student-web
          npm run typecheck --prefix apps/student-web
          npm test --prefix apps/student-web
          npm run build --prefix apps/student-web

  student-browser:
    name: Real Chromium · auth/access/curriculum · 390px
    needs: student-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage14_student
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage14_student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage14_student
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5174
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API and Student dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Build runtime applications
        run: |
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run typecheck --prefix apps/student-web
          npm run build --prefix apps/student-web
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify Student curriculum and Reader contracts
        working-directory: apps/api
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/integration/student-curriculum.integration.test.ts
          tests/integration/student-reader.integration.test.ts
      - name: Seed activation codes
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "insert into full_access_codes (code, entitlement_duration_days) values
          ('654321', 365), ('654322', 365), ('654323', 365);"
      - name: Create recovery-support Admin fixture
        env:
          ADMIN_BOOTSTRAP_IDENTIFIER: stage14-admin
          ADMIN_BOOTSTRAP_PASSWORD: Stage14-${{ github.run_id }}-${{ github.run_attempt }}!
          ADMIN_BOOTSTRAP_DISPLAY_NAME: مدير اختبار الطالب
        run: npm run auth:create-admin --prefix apps/api
      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium
      - name: Run real Student browser suite
        run: npm run test:e2e --prefix apps/student-web
