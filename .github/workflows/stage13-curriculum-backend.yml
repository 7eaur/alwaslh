name: Stage 13 Curriculum Backend Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage13-curriculum-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage13-curriculum-backend:
    name: Stage 13 · Curriculum structure backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13
      LOG_LEVEL: silent
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Lint, typecheck, unit test and build API
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify curriculum PostgreSQL contracts
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname in ('curriculum_sections','curriculum_events') and relkind='r'")" = "2"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from information_schema.columns where table_name='subject_class_links' and column_name in ('status','updated_at')")" = "2"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from information_schema.columns where table_name='lessons' and column_name='section_id'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_constraint where conname in ('curriculum_sections_offering_fk','curriculum_sections_scope_id_unique','curriculum_sections_slug_unique','lessons_section_scope_fk','curriculum_events_metadata_object')")" = "5"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_indexes where indexname in ('idx_subject_class_links_class_status_position','idx_curriculum_sections_offering_position','idx_lessons_offering_section_position','idx_curriculum_events_resource_created','idx_curriculum_events_actor_created')")" = "5"
      - name: Run Admin curriculum API and PostgreSQL scope tests
        run: node --test --import tsx tests/integration/curriculum.integration.test.ts
        working-directory: apps/api
