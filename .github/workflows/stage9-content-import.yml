name: Stage 9 Content Import Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage9-content-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-9-content-import:
    name: Stage 9 · Full source inventory and PostgreSQL import
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_content
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_content"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_content
      LOG_LEVEL: silent
      PGPASSWORD: postgres
      ALWASLH_GO_REVISION: f81ebb6ef6198818fa091f7a8c1c81b4de7dbd23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies and PostgreSQL client
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Verify Stage 9 unit contracts
        run: |
          python3 -m unittest content.tests.test_alwaslh_go_inventory
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api

      - name: Fetch pinned alwaslh-go Git source without materializing image bytes
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/7eaur/alwaslh-go.git /tmp/alwaslh-go
          git -C /tmp/alwaslh-go checkout --detach "$ALWASLH_GO_REVISION"
          test "$(git -C /tmp/alwaslh-go rev-parse HEAD)" = "$ALWASLH_GO_REVISION"

      - name: Build and validate complete 5,552-image inventory
        run: |
          mkdir -p /tmp/alwaslh-stage9
          python3 content/tooling/alwaslh_go_inventory.py \
            --repo /tmp/alwaslh-go \
            --config content/import-contracts/alwaslh-go-source-map.json \
            --output /tmp/alwaslh-stage9/inventory.json \
            --summary /tmp/alwaslh-stage9/summary.json
          python3 - <<'PY'
          import json
          with open('/tmp/alwaslh-stage9/summary.json', encoding='utf-8') as f:
              s = json.load(f)
          assert s['summary']['subjectRoots'] == 15, s
          assert s['summary']['documents'] == 48, s
          assert s['summary']['images'] == 5552, s
          assert s['summary']['helperFiles'] == 76, s
          assert s['summary']['extensions'] == {'.jpg': 4218, '.webp': 1334}, s
          assert s['summary']['fatalIssues'] == 0, s
          PY

      - name: Apply migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api

      - name: Import canonical source inventory
        run: npm run content:import-source --prefix apps/api -- /tmp/alwaslh-stage9/inventory.json

      - name: Re-import identical inventory to prove idempotency
        run: npm run content:import-source --prefix apps/api -- /tmp/alwaslh-stage9/inventory.json

      - name: Verify database import counts, presence and uniqueness
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from content_import_runs")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from content_source_documents where is_present")" = "48"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from content_source_assets where is_present")" = "5552"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from content_source_documents where not is_present")" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from content_source_assets where not is_present")" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from (select document_id, position from content_source_assets where is_present group by document_id, position having count(*) > 1) d")" = "0"
          test "$(psql "$DATABASE_URL" -Atqc "select asset_count from content_import_runs")" = "5552"
