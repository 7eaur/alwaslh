name: Stage 13D Admin Upload UI Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage13d-admin-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage13d-admin-ui:
    name: Stage 13D · Admin upload + publication browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13d_admin_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13d_admin_ui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13d_admin_ui
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5175
      MEDIA_STORAGE_ROOT: /tmp/alwaslh-stage13d-media
      PGPASSWORD: postgres
      VITE_API_BASE_URL: http://127.0.0.1:3000
      STAGE13D_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install media runtime and PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils postgresql-client >/dev/null
          mkdir -p "$MEDIA_STORAGE_ROOT"
          pdfinfo -v
          pdftoppm -v
      - name: Install API and Admin dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/admin-web --ignore-scripts --no-audit --no-fund
      - name: Verify API and Admin quality gates
        run: |
          npm run lint --prefix apps/api
          npm run typecheck --prefix apps/api
          npm test --prefix apps/api
          npm run build --prefix apps/api
          npm run lint --prefix apps/admin-web
          npm run typecheck --prefix apps/admin-web
          npm test --prefix apps/admin-web
          npm run build --prefix apps/admin-web
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Create explicit E2E Super Admin
        env:
          ADMIN_BOOTSTRAP_IDENTIFIER: stage13d-admin-ui
          ADMIN_BOOTSTRAP_PASSWORD: Stage13dAdminUiPass123!
          ADMIN_BOOTSTRAP_DISPLAY_NAME: مدير اختبار رفع المحتوى
        run: npm run auth:create-admin --prefix apps/api
      - name: Seed explicit Stage13D curriculum fixture
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          with created_class as (
            insert into classes (slug, name, position)
            values ('stage13d-grade', 'الصف التجريبي للرفع', 0)
            returning id
          ), created_subject as (
            insert into subjects (slug, name)
            values ('stage13d-subject', 'المادة التجريبية للرفع')
            returning id
          ), created_offering as (
            insert into subject_class_links (class_id, subject_id, position, status)
            select created_class.id, created_subject.id, 0, 'active'
            from created_class cross join created_subject
            returning class_id, subject_id
          )
          insert into lessons (class_id, subject_id, slug, title, position, status)
          select class_id, subject_id, 'stage13d-mixed-upload', 'درس الرفع المختلط التجريبي', 0, 'active'
          from created_offering;
          SQL
      - name: Install Chromium
        run: npx --prefix apps/admin-web playwright install --with-deps chromium
      - name: Run Stage13D real browser flow
        run: npx --prefix apps/admin-web playwright test e2e/content-ingestion.e2e.spec.mjs
