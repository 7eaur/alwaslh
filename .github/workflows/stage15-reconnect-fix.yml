name: Stage15 One-shot Reconnect Fix

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - ".github/workflows/stage15-reconnect-fix.yml"

permissions:
  contents: write

jobs:
  apply-reconnect-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted Student assessment reconnect fix
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("apps/student-web/src/student-assessment.tsx")
          text = source.read_text()

          old = '''  onBack,\n  onSessionExpired,\n}: {\n  assessment: StudentAssessmentSession;\n  online: boolean;\n  onChange: (next: StudentAssessmentSession) => void;\n  onBack: () => void;\n  onSessionExpired: () => void;\n}) {'''
          new = '''  onBack,\n  onSessionExpired,\n  onUnavailable,\n}: {\n  assessment: StudentAssessmentSession;\n  online: boolean;\n  onChange: (next: StudentAssessmentSession) => void;\n  onBack: () => void;\n  onSessionExpired: () => void;\n  onUnavailable: (message: string) => void;\n}) {'''
          if text.count(old) != 1:
              raise SystemExit("AssessmentWorkspace signature target mismatch")
          text = text.replace(old, new)

          old = '''    } catch (requestError) {\n      if (isMissingSessionError(requestError)) {\n        onSessionExpired();\n        return;\n      }\n      setError(requestMessage(requestError));\n    } finally {'''
          new = '''    } catch (requestError) {\n      if (requestError instanceof ApiRequestError && requestError.code === "NOT_FOUND") {\n        onUnavailable(requestError.message);\n        return;\n      }\n      if (isMissingSessionError(requestError)) {\n        onSessionExpired();\n        return;\n      }\n      setError(requestMessage(requestError));\n    } finally {'''
          if text.count(old) != 1:
              raise SystemExit("AssessmentWorkspace run target mismatch")
          text = text.replace(old, new)

          old = '''      .then((next) => setActiveAssessment(next))\n      .catch((error: unknown) => {\n        if (isMissingSessionError(error)) onSessionExpired();\n        else setActionError(requestMessage(error));\n      });'''
          new = '''      .then((next) => setActiveAssessment(next))\n      .catch((error: unknown) => {\n        if (error instanceof ApiRequestError && error.code === "NOT_FOUND") {\n          setActiveAssessment(null);\n          setActionError(error.message);\n          void load();\n          return;\n        }\n        if (isMissingSessionError(error)) onSessionExpired();\n        else setActionError(requestMessage(error));\n      });'''
          if text.count(old) != 1:
              raise SystemExit("reconnect effect target mismatch")
          text = text.replace(old, new)

          old = '''          onSessionExpired={onSessionExpired}\n          onChange={applyAssessment}\n          onBack={() => {\n            setActiveAssessment(null);\n            setActionError(null);\n          }}\n        />'''
          new = '''          onSessionExpired={onSessionExpired}\n          onChange={applyAssessment}\n          onUnavailable={(message) => {\n            setActiveAssessment(null);\n            setActionError(message);\n            void load();\n          }}\n          onBack={() => {\n            setActiveAssessment(null);\n            setActionError(null);\n          }}\n        />'''
          if text.count(old) != 1:
              raise SystemExit("AssessmentWorkspace usage target mismatch")
          source.write_text(text.replace(old, new))

          spec = Path("apps/student-web/e2e/assessment.e2e.spec.mjs")
          text = spec.read_text()
          old = '''  await reconnectPromise;\n  await expect(directInput).toBeEnabled();\n  await expectNoHorizontalOverflow(page);\n});\n'''
          new = '''  await reconnectPromise;\n  await expect(directInput).toBeEnabled();\n  await expectNoHorizontalOverflow(page);\n\n  await page.route(`**/v1/student/assessment-sessions/${resumeSessionId}`, async (route) => {\n    if (route.request().method() === "GET") {\n      await route.fulfill({\n        status: 404,\n        contentType: "application/json",\n        body: JSON.stringify({ error: { code: "NOT_FOUND", message: "الاختبار غير متاح" } }),\n      });\n      return;\n    }\n    await route.continue();\n  });\n  await page.context().setOffline(true);\n  await page.evaluate(() => window.dispatchEvent(new Event("offline")));\n  await page.context().setOffline(false);\n  await page.evaluate(() => window.dispatchEvent(new Event("online")));\n  await expect(page.getByRole("heading", { name: "التدريبات والاختبارات" })).toBeVisible();\n  await expect(page.getByText("الاختبار غير متاح", { exact: true })).toBeVisible();\n  await expect(page.locator(".assessment-workspace")).toHaveCount(0);\n});\n'''
          if text.count(old) != 1:
              raise SystemExit("assessment E2E reconnect target mismatch")
          spec.write_text(text.replace(old, new))
          PY
      - name: Install Student dependencies
        run: npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Verify Student quality
        run: |
          npm run lint --prefix apps/student-web
          npm run typecheck --prefix apps/student-web
          npm test --prefix apps/student-web
      - name: Commit reconnect fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/student-web/src/student-assessment.tsx apps/student-web/e2e/assessment.e2e.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(student): exit unavailable assessment on reconnect"
          git push origin HEAD:parallel/stage14-student-product
