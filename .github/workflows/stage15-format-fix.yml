name: Stage15 One-shot Formatter

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - ".github/workflows/stage15-format-fix.yml"

permissions:
  contents: write

jobs:
  format-assessment-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Format Stage15 integration test
        working-directory: apps/api
        run: npx biome format --write tests/integration/student-assessment.integration.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/api/tests/integration/student-assessment.integration.test.ts; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/tests/integration/student-assessment.integration.test.ts
          git commit -m "style(student): format assessment integration"
          git push origin HEAD:parallel/stage14-student-product
