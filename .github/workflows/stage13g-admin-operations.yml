name: Stage 13G Admin Operations Verification

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - integration/stage13g-admin-product

permissions:
  contents: read

concurrency:
  group: stage13g-admin-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-operations-backend:
    name: Stage 13G · Admin operations backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13g
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13g"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13g
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://localhost:5173
      MEDIA_STORAGE_ROOT: /tmp/alwaslh-stage13g-media
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          mkdir -p "$MEDIA_STORAGE_ROOT"
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: API lint
        run: npm run lint --prefix apps/api
      - name: API strict typecheck
        run: npm run typecheck --prefix apps/api
      - name: API unit tests
        run: npm test --prefix apps/api
      - name: API build
        run: npm run build --prefix apps/api
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Verify Stage13G database contract
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_enum e join pg_type t on t.oid=e.enumtypid where t.typname='access_event_type' and e.enumlabel='code_revoked'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname in ('full_access_codes','class_access_codes','student_entitlements','access_redemptions','access_events','student_devices','auth_events','notifications','notification_reads') and relkind='r'")" = "9"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_enum e join pg_type t on t.oid=e.enumtypid where t.typname='notification_severity' and e.enumlabel in ('info','success','warning','critical')")" = "4"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_class where relname in ('curriculum_events','ai_output_review_events','question_bank_events','quiz_builder_events','ai_execution_runtime_control','ai_route_runtime_state') and relkind='r'")" = "6"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from pg_enum e join pg_type t on t.oid=e.enumtypid where t.typname='quiz_builder_event_action' and e.enumlabel='archive'")" = "1"
      - name: Run Stage13G Accounts + Access integration
        working-directory: apps/api
        run: node --test --import tsx tests/integration/admin-student-access.integration.test.ts
      - name: Run Stage13G Notifications + Operations integration
        working-directory: apps/api
        run: node --test --import tsx tests/integration/admin-notifications-operations.integration.test.ts
      - name: Run Stage13G Reports + Settings + Security + Audit integration
        working-directory: apps/api
        run: node --test --import tsx tests/integration/admin-governance.integration.test.ts
      - name: Run Stage13G AI authoring integration
        working-directory: apps/api
        run: |
          node --test --import tsx tests/integration/admin-ai-authoring.integration.test.ts
          node --test --import tsx tests/integration/admin-ai-quiz-application.integration.test.ts
      - name: Run Access and Auth regression
        working-directory: apps/api
        run: |
          node --test --import tsx tests/integration/access.integration.test.ts
          node --test --import tsx tests/integration/auth.integration.test.ts

  admin-operations-web:
    name: Stage 13G · Admin UI quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Admin dependencies
        run: npm install --prefix apps/admin-web --ignore-scripts --no-audit --no-fund
      - name: Admin lint
        run: npm run lint --prefix apps/admin-web
      - name: Admin strict typecheck
        run: npm run typecheck --prefix apps/admin-web
      - name: Admin unit tests
        run: npm test --prefix apps/admin-web
      - name: Admin build
        run: npm run build --prefix apps/admin-web

  admin-operations-chromium:
    name: Stage 13G · Real API + PostgreSQL + Chromium
    needs:
      - admin-operations-backend
      - admin-operations-web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alwaslh_stage13g_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage13g_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alwaslh_stage13g_browser
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5175
      MEDIA_STORAGE_ROOT: /tmp/alwaslh-stage13g-media
      PGPASSWORD: postgres
      VITE_API_BASE_URL: http://127.0.0.1:3000
      STAGE13G_E2E: "1"
      STAGE13G_ADMIN_IDENTIFIER: stage13g-admin-ui
      STAGE13G_ADMIN_PASSWORD: Stage13gAdminUiPass123!
      STAGE13G_STUDENT_IDENTIFIER: stage13g-student-ui
      STAGE13E_E2E_API_BASE_URL: http://127.0.0.1:3000
      STAGE13E_E2E_ADMIN_ORIGIN: http://127.0.0.1:5175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          mkdir -p "$MEDIA_STORAGE_ROOT"
      - name: Install API and Admin dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/admin-web --ignore-scripts --no-audit --no-fund
      - name: Build API and Admin from verified source
        run: |
          npm run build --prefix apps/api
          npm run build --prefix apps/admin-web
      - name: Apply all migrations on clean PostgreSQL
        run: npm run db:migrate --prefix apps/api
      - name: Create explicit Stage13G E2E Super Admin
        env:
          ADMIN_BOOTSTRAP_IDENTIFIER: stage13g-admin-ui
          ADMIN_BOOTSTRAP_PASSWORD: Stage13gAdminUiPass123!
          ADMIN_BOOTSTRAP_DISPLAY_NAME: مدير اختبار الطلاب والوصول
        run: npm run auth:create-admin --prefix apps/api
      - name: Seed deterministic Stage13G browser fixtures
        working-directory: apps/api
        run: node --import tsx tests/fixtures/stage13g-admin-access-e2e-seed.ts
      - name: Verify browser fixture invariants
        run: |
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from profiles p join auth_credentials c on c.profile_id=p.id where p.role='student' and c.normalized_identifier='stage13g-student-ui'")" = "1"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from full_access_codes")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from class_access_codes")" = "3"
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from student_entitlements where status='active'")" = "1"
      - name: Install Chromium
        run: npx --prefix apps/admin-web playwright install --with-deps chromium
      - name: Run Stage13G real Admin Chromium suite
        working-directory: apps/admin-web
        run: >-
          npx playwright test
          e2e/admin-student-access.e2e.spec.mjs
          e2e/admin-operations.e2e.spec.mjs
          e2e/admin-reports.e2e.spec.mjs
          e2e/admin-governance.e2e.spec.mjs
