name: Stage16 Student PWA

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - "apps/student-web/**"
      - "apps/api/src/offline/**"
      - "apps/api/src/app.ts"
      - "apps/api/tests/integration/student-offline.integration.test.ts"
      - ".github/workflows/stage16-student-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lease:
    name: Student offline · PostgreSQL lease contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh_stage16_student
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage16_student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh_stage16_student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify bounded Student offline lease
        working-directory: apps/api
        run: node --import tsx --test --test-concurrency=1 tests/integration/student-offline.integration.test.ts

  pwa-shell:
    name: Student PWA · app shell · real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Student dependencies
        run: npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Build Student app
        run: npm run build --prefix apps/student-web
      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium
      - name: Verify installable offline-safe app shell
        working-directory: apps/student-web
        run: npx playwright test e2e/pwa-shell.e2e.spec.mjs --config=playwright.pwa.config.mjs
