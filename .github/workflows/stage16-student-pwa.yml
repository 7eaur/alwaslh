name: Stage16 Student PWA

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - "apps/student-web/**"
      - "apps/api/src/offline/**"
      - "apps/api/src/config.ts"
      - "apps/api/src/curriculum/student-reader.ts"
      - "apps/api/src/app.ts"
      - "apps/api/tests/offline-signing.test.ts"
      - "apps/api/tests/integration/student-offline.integration.test.ts"
      - "apps/api/tests/integration/student-offline-download.integration.test.ts"
      - ".github/workflows/stage16-student-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lease:
    name: Student offline · PostgreSQL lease/download contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh_stage16_student
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage16_student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh_stage16_student
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Verify API signing unit policy
        working-directory: apps/api
        run: node --import tsx --test tests/offline-signing.test.ts
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify bounded Student offline lease and protected download contracts
        working-directory: apps/api
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/integration/student-offline.integration.test.ts
          tests/integration/student-offline-download.integration.test.ts

  offline-client:
    name: Student offline · lifecycle/materialization · real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh_stage16_client
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage16_client"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh_stage16_client
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5174
      VITE_OFFLINE_AUTH_PUBLIC_KEY_SPKI: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2FrUJV0pXSOuz0j98o48vPAnWIa9IBNVzBbWB5VxFWsunmwrSIc0D9clavqX4QFg1dPRq3vEkD21VNdpwpFflA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API and Student dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Build runtime applications
        run: |
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run typecheck --prefix apps/student-web
          npm run build --prefix apps/student-web
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Seed isolated offline acceptance codes
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "insert into full_access_codes (code, entitlement_duration_days) values
          ('654322', 365), ('654323', 365);"
      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium
      - name: Verify IndexedDB lease lifecycle and protected materialization
        working-directory: apps/student-web
        run: >-
          npx playwright test
          e2e/offline-lease.e2e.spec.mjs
          e2e/offline-download.e2e.spec.mjs

  pwa-shell:
    name: Student PWA · app shell · real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Student dependencies
        run: npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Build Student app
        run: npm run build --prefix apps/student-web
      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium
      - name: Verify installable offline-safe app shell
        working-directory: apps/student-web
        run: npx playwright test e2e/pwa-shell.e2e.spec.mjs --config=playwright.pwa.config.mjs
