name: Stage15 Student Assessment

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - "apps/api/src/student-assessment/**"
      - "apps/api/src/app.ts"
      - "apps/api/tests/integration/student-assessment.integration.test.ts"
      - "database/migrations/0023_student_assessment_runtime.sql"
      - ".github/workflows/stage15-student-assessment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assessment-postgresql:
    name: Student assessment · PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify Student assessment integration
        working-directory: apps/api
        run: node --import tsx --test --test-concurrency=1 tests/integration/student-assessment.integration.test.ts
