# Student Track exact-head verification trigger 2
name: Stage15 Student Assessment

on:
  push:
    branches:
      - parallel/stage14-student-product
    paths:
      - "apps/api/src/student-assessment/**"
      - "apps/api/src/curriculum/student-reader.ts"
      - "apps/api/src/app.ts"
      - "apps/api/tests/integration/student-assessment.integration.test.ts"
      - "apps/api/tests/integration/student-publication-time.integration.test.ts"
      - "apps/student-web/src/**"
      - "apps/student-web/e2e/assessment-fixture.ts"
      - "apps/student-web/e2e/assessment.e2e.spec.mjs"
      - "apps/student-web/playwright.config.mjs"
      - "database/migrations/0023_student_assessment_runtime.sql"
      - ".github/workflows/stage15-student-assessment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage15-student-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assessment-postgresql:
    name: Student assessment · PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Verify Student assessment and publication-time integration
        working-directory: apps/api
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/integration/student-assessment.integration.test.ts
          tests/integration/student-publication-time.integration.test.ts

  assessment-browser:
    name: Student assessment · real Chromium · 390px
    needs: assessment-postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: alwaslh_stage15_student
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alwaslh_stage15_student"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/alwaslh_stage15_student
      LOG_LEVEL: silent
      ALLOWED_ORIGINS: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API and Student dependencies
        run: |
          npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/student-web --ignore-scripts --no-audit --no-fund
      - name: Build runtime applications
        run: |
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run typecheck --prefix apps/student-web
          npm run build --prefix apps/student-web
      - name: Apply clean PostgreSQL migrations
        run: npm run db:migrate --prefix apps/api
      - name: Install Chromium
        run: npx --prefix apps/student-web playwright install --with-deps chromium
      - name: Run Stage15 Student browser acceptance
        working-directory: apps/student-web
        run: npx playwright test e2e/assessment.e2e.spec.mjs
