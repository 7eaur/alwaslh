name: Legacy Content Format Fix

on:
  push:
    branches:
      - content/legacy-supabase-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/legacy-supabase-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Apply repository formatter to legacy importer files only
        run: |
          cd apps/api
          npx biome check --write \
            src/content/legacy-content-reset.ts \
            src/content/legacy-supabase-client.ts \
            src/content/legacy-supabase-importer.ts \
            src/content/legacy-supabase-model.ts \
            src/content/legacy-supabase-verifier.ts \
            src/content/legacy-supabase-import-cli.ts \
            tests/legacy-supabase-model.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/content apps/api/tests/legacy-supabase-model.test.ts
          git commit -m 'style: format legacy Supabase importer'
          git push origin HEAD:content/legacy-supabase-import
