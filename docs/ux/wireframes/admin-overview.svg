<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="t d"><title id="t">Admin UX wireframe — الوسيلة الذكية</title><desc id="d">Low fidelity desktop admin information architecture wireframe</desc><rect width="1440" height="1024" fill="#F7FAF9"/><style>.t{font-family:Cairo,Tajawal,Noto Sans Arabic,sans-serif;fill:#123C43}.m{fill:#66757A}.line{stroke:#DCE5E4;stroke-width:2}.box{fill:#fff;stroke:#DCE5E4;stroke-width:2}.accent{fill:#E6F7F6}.active{fill:#00B5A9}.small{font-size:18px}.body{font-size:22px}.h{font-size:32px;font-weight:700}.tiny{font-size:15px}</style><rect x="0" y="0" width="1440" height="82" fill="#fff"/><line x1="0" y1="82" x2="1440" y2="82" class="line"/><text x="1110" y="52" text-anchor="end" class="t h">نظرة عامة</text><rect x="90" y="22" width="260" height="40" rx="10" class="box"/><text x="330" y="48" text-anchor="end" class="t small">بحث في الإدارة</text><circle cx="45" cy="42" r="18" fill="#E6F7F6"/><rect x="1165" y="82" width="275" height="942" fill="#fff"/><line x1="1165" y1="82" x2="1165" y2="1024" class="line"/><rect x="1190" y="110" width="225" height="64" rx="12" class="accent"/><circle cx="1380" cy="142" r="18" class="active"/><text x="1348" y="149" text-anchor="end" class="t body" font-weight="700">الوسيلة الذكية</text><text x="1390" y="220" text-anchor="end" class="t body" font-weight="700">الرئيسية</text><rect x="1190" y="236" width="225" height="46" rx="8" fill="#D7F4F1"/><text x="1390" y="266" text-anchor="end" class="t small">نظرة عامة</text><text x="1390" y="326" text-anchor="end" class="m small">المحتوى</text><text x="1360" y="368" text-anchor="end" class="t small">الصفوف والمواد</text><text x="1360" y="408" text-anchor="end" class="t small">الدروس</text><text x="1360" y="448" text-anchor="end" class="t small">الرفع والمعالجة</text><text x="1390" y="508" text-anchor="end" class="m small">الاختبارات والذكاء</text><text x="1360" y="550" text-anchor="end" class="t small">الاختبارات</text><text x="1360" y="590" text-anchor="end" class="t small">عمليات الذكاء</text><text x="1390" y="650" text-anchor="end" class="m small">الطلاب والوصول</text><text x="1360" y="692" text-anchor="end" class="t small">الطلاب</text><text x="1360" y="732" text-anchor="end" class="t small">أكواد الوصول</text><text x="1360" y="772" text-anchor="end" class="t small">أكواد الصفوف</text><text x="1390" y="832" text-anchor="end" class="m small">التواصل والتقارير</text><text x="1360" y="874" text-anchor="end" class="t small">الإشعارات</text><text x="1360" y="914" text-anchor="end" class="t small">التقارير</text><text x="1390" y="974" text-anchor="end" class="m small">النظام · الإعدادات · الأمان</text><text x="1115" y="135" text-anchor="end" class="t tiny">ما يحتاج انتباه المدير الآن — بيانات فعلية فقط</text><rect x="70" y="165" width="1045" height="128" rx="14" class="box"/><text x="1070" y="205" text-anchor="end" class="t body" font-weight="700">تحتاج إلى إجراء</text><rect x="790" y="225" width="280" height="44" rx="8" fill="#F2F4F7"/><text x="1045" y="253" text-anchor="end" class="m small">فشل معالجة / مراجعة محتوى</text><rect x="475" y="225" width="280" height="44" rx="8" fill="#F2F4F7"/><text x="730" y="253" text-anchor="end" class="m small">مهام AI تحتاج مراجعة</text><rect x="160" y="225" width="280" height="44" rx="8" fill="#F2F4F7"/><text x="415" y="253" text-anchor="end" class="m small">أكواد/حسابات تحتاج متابعة</text><rect x="70" y="330" width="675" height="610" rx="14" class="box"/><text x="700" y="374" text-anchor="end" class="t body" font-weight="700">العمل الجاري</text><rect x="100" y="400" width="615" height="56" rx="8" fill="#F7FAF9"/><text x="680" y="434" text-anchor="end" class="t small">رفع كتاب الفيزياء — 74%</text><rect x="100" y="470" width="615" height="56" rx="8" fill="#F7FAF9"/><text x="680" y="504" text-anchor="end" class="t small">توليد اختبار — يحتاج مراجعة</text><rect x="100" y="540" width="615" height="56" rx="8" fill="#F7FAF9"/><text x="680" y="574" text-anchor="end" class="t small">معالجة صفحات — فشل عنصر واحد</text><line x1="100" y1="630" x2="715" y2="630" class="line"/><text x="680" y="674" text-anchor="end" class="t small" font-weight="700">قواعد العرض</text><text x="680" y="712" text-anchor="end" class="m tiny">• لا أرقام وهمية</text><text x="680" y="742" text-anchor="end" class="m tiny">• progress حقيقي للعمليات الطويلة</text><text x="680" y="772" text-anchor="end" class="m tiny">• retry/cancel حيث يسمح العقد</text><text x="680" y="802" text-anchor="end" class="m tiny">• أخطاء واضحة، لا تحويلها إلى Empty</text><rect x="780" y="330" width="335" height="610" rx="14" class="box"/><text x="1070" y="374" text-anchor="end" class="t body" font-weight="700">إجراءات سريعة</text><rect x="815" y="410" width="265" height="54" rx="10" class="active"/><text x="1045" y="445" text-anchor="end" fill="#fff" font-family="Cairo,Tajawal,sans-serif" font-size="19">رفع محتوى جديد</text><rect x="815" y="480" width="265" height="54" rx="10" class="accent"/><text x="1045" y="515" text-anchor="end" class="t small">إنشاء اختبار</text><rect x="815" y="550" width="265" height="54" rx="10" class="accent"/><text x="1045" y="585" text-anchor="end" class="t small">توليد أكواد</text><rect x="815" y="620" width="265" height="54" rx="10" class="accent"/><text x="1045" y="655" text-anchor="end" class="t small">إرسال إشعار</text><text x="1070" y="735" text-anchor="end" class="t small" font-weight="700">نمط الشاشة الداخلية</text><rect x="815" y="760" width="265" height="40" rx="6" fill="#F2F4F7"/><text x="1050" y="786" text-anchor="end" class="m tiny">Filters + Search + Sort</text><rect x="815" y="815" width="265" height="90" rx="6" fill="#F7FAF9"/><text x="1050" y="846" text-anchor="end" class="m tiny">Table/List</text><text x="1050" y="876" text-anchor="end" class="m tiny">Detail side panel</text></svg>